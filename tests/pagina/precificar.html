<!doctype html>
<!--
  Página de teste da janela "Precificar" (src/precificar.js).
  Uma ficha com um caso real de Blastoise (11/11/2026): vendas parecidas em Gemas em dois
  grupos (~20–27 e ~100–120); em Coins, preços estáveis.
  Servir a raiz do projeto em 127.0.0.1 e abrir /tests/pagina/precificar.html, depois clicar
  em "Precificar" no quadro de preço.
-->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Teste — Precificar</title>
<link rel="stylesheet" href="cores-jogo.css">
<link rel="stylesheet" href="../../src/ui.css">
<script src="cores-jogo.js"></script>
<style>
  body { background: #120a12; color: #eee; font-family: system-ui, sans-serif; padding: 16px; }
  #ficha { position: fixed; top: 10px; left: 10px; width: 760px; }
  .fi-heroi { display: grid; grid-template-columns: 440px 300px; gap: 12px; margin: 0 0 12px; }
  .palco { background: #2a1838; height: 140px; border-radius: 8px; }
</style>
</head><body>
<div id="ficha" class="modal"><div class="fi-corpo">
  <div class="fi-heroi"><div class="fi-heroi-info">
    <div class="fi-nome">Blastoise</div><div class="fi-nivel-chip">Nv 395</div><span class="txt-num">#97553169</span>
    <div class="fi-acoes"><button>Calcular pokemon</button></div></div><div class="palco"></div></div>
  <section class="fi-cartao">Stats atuais…</section>
</div></div>
<script src="../../src/config.js"></script>
<script src="../../src/dinheiro.js"></script>
<script src="../../src/motor.js"></script>
<script>
  const agora = Date.now(), H = 3600e3;
  const vendas = []; let id = 1;
  const v = (extra) => Object.assign({ id: id++, em: agora - id * 5 * H, moeda: 'orb', preco: 50, speciesId: 9, nome: 'Blastoise', level: 395, nota: 3.6,
    ivTotal: 100 + (id * 7) % 50, quality: [1.8, 1.596, 1.741, 1.44][id % 4], potencia: [1, 1, 4, 2][id % 4], shiny: false, aoe: false, zmove: false, mega: false, refino: 0 }, extra);
  // Gemas: grupo barato e grupo caro (o caro com mais AoE, nível e refino)
  for (let i = 0; i < 18; i++) vendas.push(v({ preco: 20 + (i % 8), level: 300 + i * 6, nota: 3.53 + (i % 6) * 0.02 }));
  for (let i = 0; i < 14; i++) vendas.push(v({ preco: 100 + (i % 3) * 10, level: 380 + i * 12, nota: 3.55 + (i % 5) * 0.02, aoe: i < 3, refino: 3 }));
  // #caro: vendas caras recentes e parecidas com esta ficha, para o grupo caro virar o "★ mais parecido"
  // (#caro=N muda quantas entram; com 7 a 11 os dois grupos ficam quase empatados e nenhum ganha a ★).
  // O texto do "justo no vão" é conferido com PIPrecificar._htmlGrupos e um resultado montado à mão.
  const nCaro = /^#caro/.test(location.hash) ? Number((location.hash.match(/caro=(\d+)/) || [])[1] || 12) : 0;
  for (let i = 0; i < nCaro; i++) vendas.push(v({ preco: 100 + (i % 3) * 10, level: 375 + i * 3, nota: 3.58 + (i % 3) * 0.01, em: agora - (i + 1) * H }));
  // Coins: estáveis
  for (let i = 0; i < 30; i++) vendas.push(v({ moeda: 'gold', preco: 1.8e8 + (i % 5) * 1e7, level: 330 + i * 7, nota: 3.53 + (i % 6) * 0.02 }));
  // #sync: finge uma busca no jogo (Gemas 4 páginas, Coins 3, uma página a cada 1,5 s alternando,
  // como a fila do ws.js) para ver o andamento no quadro: "atualizando gemas pág. 2 · coins pág. 1…"
  const comSync = location.hash === '#sync';
  // #tabela: a Tabela de preços do jogo não responde há 5 h (ws.js desistiu): o quadro mostra o cache e avisa
  const tabelaFora = location.hash === '#tabela';
  // #longe: o mesmo Blastoise com Nv 5.000 — a espécie tem vendas, mas nenhuma parecida
  // ("poucas com Nv e Nota parecidos" no quadro)
  const nivel = location.hash === '#longe' ? 5000 : 395;
  window.PIWs = { pokemon: () => ({ id: 97553169, speciesId: 9, nome: 'Blastoise', level: nivel, nota: 3.598, quality: 1.8, potencia: 1, shiny: false, tmAoe: false, tmElemental: null, ivTotal: 130 }), conectado: () => comSync || tabelaFora,
    tabela: () => ({ fora: tabelaFora, desde: tabelaFora ? agora - 5 * H : 0, podeTestar: false }) };
  window.PIStore = { vendasPorEspecie: async () => vendas, vendasPorClasse: async () => [] };
  let filaFalsa = Promise.resolve();
  window.PISync = { vaiBuscar: async () => comSync, sincronizar: async (busca, moeda, aoProgresso) => {
    if (tabelaFora) { const e = new Error('a Tabela de preços do jogo não está respondendo'); e.tabela = true; throw e; }
    if (!comSync) return { pulou: true };
    for (let p = 1; p <= (moeda === 'orb' ? 4 : 3); p++) {
      filaFalsa = filaFalsa.then(() => new Promise(r => setTimeout(r, 1500)));
      await filaFalsa;
      if (aoProgresso) aoProgresso({ pagina: p });
    }
    return { pulou: false };
  } };
</script>
<script src="../../src/ui.js"></script>
<script src="../../src/anuncio-logica.js"></script>
<script src="../../src/analise.js"></script>
<script src="../../src/precificar.js"></script>
</body></html>
